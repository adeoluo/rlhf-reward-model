[project]
name = "rlhf-reward-model"
version = "0.1.0"
description = "A Bradley-Terry reward model with PPO and DPO policy optimization, built from scratch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Optional, opt-in only: an independent check that the hand-derived DPO gradient
# (benchmarks/gradient_check.py, tests/test_gradient_parity.py) matches a NumPy
# finite-difference reference. Not installed by default CI; the core library does not require it.
# Run with: uv sync --group validation && uv run pytest tests/test_gradient_parity.py
validation = [
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlhf_reward_model"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["rlhf_reward_model"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: full-fidelity experiments (the over-optimization turn-over needs the full training budget); excluded from the default CI run and reproduced by the benchmarks.",
]

[tool.coverage.run]
source = ["src"]
branch = true
